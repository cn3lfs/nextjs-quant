appId: com.guanlan.quant
productName: GuanlanQuant
directories:
  output: release
files:
  - desktop/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
      - "!release{,/**/*}"
      - "!.test-data{,/**/*}"
      - "!test-results{,/**/*}"
      - "!tests{,/**/*}"
      - "!docs{,/**/*}"
      - "!src{,/**/*}"
      - "!packages{,/**/*}"
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"
asar: true
npmRebuild: false
win:
  target:
    - target: dir
      arch: [x64]
